server {
    listen 80;
    server_name _;

    # Story and profile images are accepted by the backend up to 15 MiB.
    client_max_body_size 16m;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the API on the same origin as the frontend.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat uses a long-lived WebSocket connection.
    location /ws/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Public browser URLs for uploaded media. RustFS itself stays private.
    # Keep the bucket name in the URL because the backend generates links
    # under /autogis-media/.
    location /autogis-media/ {
        proxy_pass http://rustfs:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
